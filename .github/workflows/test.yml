name: Python tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  SCALLOPS_CACHE_DIR: ${{ github.workspace }}/../scallops-data

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v6
    - name: Cache test data
      uses: actions/cache@v4
      with:
        path: ${{ env.SCALLOPS_CACHE_DIR }}
        key: test-data-${{ hashFiles('scallops/datasets/registry.txt') }}
        restore-keys: test-data-
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-xdist miniwdl
        pip install -e .

    - name: Test with pytest
      run: |
        pytest -n auto
