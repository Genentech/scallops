[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "cython",
    "numpy",
    "setuptools>=77",
    "setuptools_scm>=8",
]

[project]
name = "scallops"
description = "Comprehensive package for analysis of Optical Pooled Screens (OPS) for biological data"
authors = [
    { name = "Jose Sergio Hleap" },
    { name = "Joshua Gould" },
    { name = "Bo Li" }
]
dynamic = ["version"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "adjustText",
    "anndata>=0.13.0",
    "bioio>=3",
    "bioio-nd2",
    "bioio-ome-tiff",
    "bioio-ome-zarr",
    "bioio-tifffile",
    "centrosome",
    "cp-measure>=0.2.0",
    "dask-image",
    "dask",
    "decorator",
    "distributed",
    "filelock",
    "flox",
    "fsspec",
    "igraph",
    "itk-elastix",
    "itk",
    "joblib",
    "kneed",
    "mahotas",
    "matplotlib",
    "natsort",
    "numcodecs",
    "numpy",
    "ome-zarr",
    "pandas",
    "pint",
    "psutil",
    "pyarrow",
    "pydantic",
    "scikit-image>=0.26.0",
    "scikit-learn",
    "scipy",
    "seaborn",
    "shapely",
    "stardist",
    "statsmodels",
    "tensorflow",
    "tifffile",
    "xarray",
    "zarr>=3"
]

[project.optional-dependencies]

dialout = [
    "pysam"
]
napari = [
    "napari",
    "napari_ome_zarr"
]
dask-ml = [
    "dask-ml"
]
cellpose = [
    "cellpose"
]
ufish = [
    "ufish"
]
test = [
    "miniwdl",
    "pytest",
    "pytest-xdist"
]
dev = [
    "pre-commit"
]
doc = [
    "ipython",
    "nbsphinx",
    "sphinx-copybutton",
    "sphinx",
    "sphinx_argparse",
    "sphinx_rtd_theme",
]

[project.entry-points."miniwdl.plugin.container_backend"]
miniwdl_local = "scallops._miniwdl_local:LocalRunner"

[project.scripts]
scallops = 'scallops.__main__:main'

[project.urls]
Documentation = "https://scallops.readthedocs.io"
Repository = "https://github.com/Genentech/scallops"

[tool.setuptools.package-data]
"scallops.datasets" = ["registry.txt"]
"scallops.features" = ["features.rst"]

[tool.setuptools.packages.find]
include = ["scallops*"]
exclude = ["docs*", "scallops.tests*"]

[tool.setuptools.exclude-package-data]
scallops = ["tests/**"]

[tool.setuptools_scm]
tag_regex = "^(?P<version>v?[0-9]{1,2}\\.[0-9]+\\.[0-9]+)$"

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F",
    # isort
    "I001"]
ignore = []

[tool.pytest.ini_options]
markers = [
    "basecalls: marks tests that are related to basecalls",
    "cli_e2e: marks tests for the CLI end to end",
    "cli_segment: marks tests for the CLI segmentation",
    "cli_spot: marks tests for the CLI spot calling",
    "features: mark tests for features",
    "io: mark tests for IO",
    "registration: tests for registration",
    "segmentation_cellpose: tests for segmentation using cellpose",
    "segmentation_propagation: tests for segmentation using propagation",
    "segmentation_stardist: tests for segmentation using stardist",
    "segmentation_watershed: tests for segmentation using watershed",
    "stats: Tests in the stats module",
    "utils: Test utils"
]
addopts = [
    "--doctest-modules",
    "--pyargs",
    "--strict-markers"
]
python_files = "test_*.py"
testpaths = [
    "scallops/tests"
]
xfail_strict = true
log_format = '%(asctime)s %(levelname)s %(message)s'
log_date_format = '%Y-%m-%d %H:%M:%S'
log_cli = true
log_cli_level = 'INFO'
filterwarnings = [
    'ignore:.* MMStack file name is invalid',
    'ignore:.* MMStack series is missing files .*'
]
